[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-handoff-toolkit"
version = "0.1.0"
description = "Portable handoff and completion-audit validation for coding agents"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
handoff-toolkit = "agent_handoff_toolkit.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
