[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-handoff-toolkit"
version = "0.2.7"
description = "Portable handoff and completion-audit validation for coding agents"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
handoff-toolkit = "agent_handoff_toolkit.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
