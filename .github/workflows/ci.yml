name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      expected_workflow_sha:
        description: Exact reviewed commit containing this workflow
        required: true
        type: string
      source_sha:
        description: Exact approved source commit to test
        required: true
        default: f042c7192797e59b9c10ab034a4d4c2bbcaee1ca
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Validate workflow dispatch inputs
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          ACTUAL_WORKFLOW_SHA: ${{ github.sha }}
          EXPECTED_WORKFLOW_SHA: ${{ inputs.expected_workflow_sha }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          readonly approved_source_sha='f042c7192797e59b9c10ab034a4d4c2bbcaee1ca'
          readonly sha_pattern='^[0-9a-f]{40}$'

          if ! [[ "$EXPECTED_WORKFLOW_SHA" =~ $sha_pattern ]]; then
            echo 'expected_workflow_sha must be exactly 40 lowercase hexadecimal characters' >&2
            exit 1
          fi
          if ! [[ "$ACTUAL_WORKFLOW_SHA" =~ $sha_pattern ]]; then
            echo 'github.sha was not an exact lowercase commit SHA' >&2
            exit 1
          fi
          if [[ "$EXPECTED_WORKFLOW_SHA" != "$ACTUAL_WORKFLOW_SHA" ]]; then
            echo 'expected_workflow_sha does not match the dispatched workflow revision' >&2
            exit 1
          fi
          if ! [[ "$SOURCE_SHA" =~ $sha_pattern ]]; then
            echo 'source_sha must be exactly 40 lowercase hexadecimal characters' >&2
            exit 1
          fi
          if [[ "$SOURCE_SHA" != "$approved_source_sha" ]]; then
            echo 'source_sha is not the approved runner-density acceptance revision' >&2
            exit 1
          fi

      - name: Check out dispatched source revision
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}

      - name: Check out repository
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install verification tools
        run: python -m pip install --disable-pip-version-check build==1.6.0 ruff==0.16.6 setuptools==84.0.0

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Lint
        run: python -m ruff check src tests distribution

      - name: Check formatting
        run: python -m ruff format --check src tests distribution

      - name: Byte-compile
        run: python -m compileall -q src tests distribution

      - name: Build package
        run: python -m build
